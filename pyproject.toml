[build-system]
# 62.3 is the first setuptools that expands "**" in package-data globs.
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-evidence-gate"
version = "0.1.0"
description = "Local-only evidence gate: a passing check must emit enough evidence to prove it had the opportunity to fail."
readme = "README.md"
requires-python = ">=3.11"
# No license has been chosen; that decision belongs to the repository owner (CONTRIBUTING.md).
license = {text = "NOASSERTION"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# The suite is stdlib unittest, so the extra pulls in nothing; it exists so
# `pip install -e '.[test]'` resolves without an unknown-extra warning.
test = []

[project.urls]
Homepage = "https://github.com/szl-holdings/scientific-evidence-gate"
Source = "https://github.com/szl-holdings/scientific-evidence-gate"
Issues = "https://github.com/szl-holdings/scientific-evidence-gate/issues"
Changelog = "https://github.com/szl-holdings/scientific-evidence-gate/blob/main/CHANGELOG.md"

[project.scripts]
science-gate = "science_gate.cli:main"

[tool.setuptools]
# The repository's fixtures/ and schemas/ ship inside the package as the
# data-only subpackages science_gate._fixtures and science_gate._schemas, so
# `science-gate demo` and `science-gate package` work from an installed wheel.
# science_gate._resources finds them there or, in a checkout, at the root.
packages = ["science_gate", "science_gate.adapters", "science_gate._fixtures", "science_gate._schemas"]
# Data comes only from the package-data globs below, never from version-control
# or MANIFEST.in discovery, so the wheel holds exactly what is listed here.
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"science_gate._fixtures" = "fixtures"
"science_gate._schemas" = "schemas"

[tool.setuptools.package-data]
"science_gate._fixtures" = ["**/*"]
"science_gate._schemas" = ["*.schema.json"]
